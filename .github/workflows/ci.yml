name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  library:
    name: macOS
    strategy:
      matrix:
        xcode: ["26.6"]
        config: ["debug", "release"]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Run ${{ matrix.config }} tests
        run: swift test -c ${{ matrix.config }}
      - name: Run ${{ matrix.config }} tests with all traits
        run: swift test -c ${{ matrix.config }} --enable-all-traits

  examples:
    name: Examples
    strategy:
      matrix:
        xcode: ["26.6"]
        scheme: ["UndoForMacOS"]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      # No signing certificate is available on CI, and the example is only built.
      - name: xcodebuild ${{ matrix.scheme }}
        run: |
          make \
            DERIVED_DATA_PATH=~/.derivedData \
            SCHEME="${{ matrix.scheme }}" \
            EXTRA_XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO" \
            xcodebuild-raw
